name: Fetch GTFS Static

on:
  schedule:
    - cron: "0 0 * * *"  # Runs at midnight UTC
  workflow_dispatch:  # Allows manual triggering via GitHub Actions UI

jobs:
  fetch-static:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify function to fetch GTFS static
        run: curl -s https://transithealthdashboard.netlify.app/.netlify/functions/fetch_gtfs_static
